name: Release

# Builds, signs, verifies and publishes a GitHub Release when a version tag is pushed.
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag must be vMAJOR.MINOR.PATCH with a numeric PATCH. The PATCH number becomes the
# versionCode and the whole tag becomes the versionName. SDK packages follow compileSdk in
# app/build.gradle, so this file does not need editing for a release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  # Public fingerprint of the release signing certificate. A build is refused if it differs.
  EXPECTED_CERT_SHA256: f06abe97928a05566812a4d3e45881b9bf30f2a242cae263b481c39a9075261f
  APK_NAME: DNS-Control

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags: the app's versionName comes from `git describe`

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Derive version code from tag
        run: |
          # vMAJOR.MINOR.PATCH -> versionCode = PATCH (for example v0.0.678 -> 678)
          PATCH="${GITHUB_REF_NAME##*.}"
          case "$PATCH" in
            ''|*[!0-9]*) echo "tag $GITHUB_REF_NAME must end in a numeric patch, e.g. v0.0.678"; exit 1 ;;
          esac
          echo "VERSION_CODE=$PATCH" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$GITHUB_REF_NAME" >> "$GITHUB_ENV"

      # GitHub-hosted ubuntu runners ship with the Android SDK preinstalled and set ANDROID_HOME.
      - name: Install SDK packages
        run: |
          test -n "$ANDROID_HOME" || { echo "ANDROID_HOME not set on runner"; exit 1; }
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || SDKMANAGER=$(command -v sdkmanager)
          "$SDKMANAGER" --version
          # the preinstalled cmdline-tools index may predate the platform: refresh it first
          "$SDKMANAGER" --update
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          # platform follows compileSdk in app/build.gradle (e.g. 37 -> platforms;android-37.x)
          COMPILE_SDK=$(grep -oE '^[[:space:]]*compileSdk[[:space:]]+[0-9]+' app/build.gradle | grep -oE '[0-9]+$' | head -1)
          test -n "$COMPILE_SDK" || { echo "compileSdk not found in app/build.gradle"; exit 1; }
          SDK_LIST=$("$SDKMANAGER" --list 2>/dev/null)
          PLATFORM=$(echo "$SDK_LIST" | grep -oE "platforms;android-${COMPILE_SDK}(\.[0-9]+)?" | sort -V | tail -1)
          BUILD_TOOLS=$(echo "$SDK_LIST" | grep -oE "build-tools;[0-9]+\.[0-9.]+" | sort -V | tail -1)
          test -n "$PLATFORM" || { echo "no platform package for android-$COMPILE_SDK"; exit 1; }
          test -n "$BUILD_TOOLS" || { echo "no build-tools package found"; exit 1; }
          echo "Installing $PLATFORM and $BUILD_TOOLS"
          "$SDKMANAGER" "$PLATFORM" "$BUILD_TOOLS"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleFdroidFullRelease --no-daemon

      - name: Verify signature, certificate and version
        run: |
          APK=$(find app/build/outputs/apk -name "*fdroid*full*release*.apk" | head -1)
          test -n "$APK" || { echo "release APK not found"; exit 1; }
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/aapt2

          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee signer.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" signer.txt \
            || { echo "v2 signature missing"; exit 1; }
          grep -q "Signer #1 certificate SHA-256 digest: $EXPECTED_CERT_SHA256" signer.txt \
            || { echo "certificate does not match the expected release key"; exit 1; }

          # the in-app version must match the tag
          "$AAPT2" dump badging "$APK" | grep -q "versionName='${GITHUB_REF_NAME}'" \
            || { echo "versionName does not match tag ${GITHUB_REF_NAME}"; exit 1; }

          cp "$APK" "$APK_NAME-$GITHUB_REF_NAME.apk"
          sha256sum "$APK_NAME-$GITHUB_REF_NAME.apk" | tee SHA256SUMS.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CERT=$(grep "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          SHA=$(awk '{print $1}' SHA256SUMS.txt)
          cat > notes.md <<NOTES
          Package: com.hidefbi.dnscontrol
          Signed by hidefbi, certificate SHA-256: $CERT
          APK SHA-256: $SHA
          Verify: \`shasum -a 256 $APK_NAME-$GITHUB_REF_NAME.apk\`
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "$APK_NAME-$GITHUB_REF_NAME.apk" SHA256SUMS.txt \
            --title "DNS Control $GITHUB_REF_NAME" \
            --notes-file notes.md
