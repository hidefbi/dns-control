// Privacy-hardened fork: Google/Firebase services are never configured.
// All release channels use the local/no-op error-reporting implementation.

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()

// https://github.com/celzero/rethink-app/issues/1032
// https://docs.gradle.org/8.2/userguide/configuration_cache.html#config_cache:requirements:external_processes
// get the git version from the command line.
// Falls back gracefully when the source tree isn't a git checkout (e.g. an extracted
// source zip with no .git folder) or git isn't installed, instead of failing the build
// with "Process 'command git' finished with non-zero exit value 128".
def gitVersion = {
    try {
        def gitExec = providers.exec {
            commandLine("git", "describe", "--tags", "--always")
            isIgnoreExitValue = true
        }
        def execResult = gitExec.result.get()
        if (execResult.exitValue == 0) {
            def out = gitExec.standardOutput.asText.get().toString().trim()
            if (!out.isEmpty()) {
                return out
            }
        }
    } catch (Exception ex) {
        logger.info("git version lookup failed, falling back: $ex.message")
    }
    // fallback: use the VERSION_CODE from gradle.properties (or env) as a stand-in versionName
    def code = System.getenv("VERSION_CODE") ?: project.properties['VERSION_CODE']
    return "v0.0.${code ?: '0'}-nogit"
}()

// for github builds, the version code is set in the github action via env
// for local builds, the version code is set in gradle.properties
def getVersionCode = {
    def code = 0
    try {
        // parseInt throws NumberFormatException if the string does not contain a parsable integer
        // but "as Integer" is a wrapper class, which silently returns null
        code = Integer.parseInt(System.getenv("VERSION_CODE"))
        logger.info("env version code: $code")
    } catch (NumberFormatException ex) {
        logger.info("missing env version code: $ex.message")
    }
    if (code == 0) {
        code = project.properties['VERSION_CODE'] as Integer
        logger.info("project properties version code: $code")
    }
    return code
}

def appVersionCode = getVersionCode()

// Controls whether per-ABI split APKs are generated alongside the universal APK.
// Was referenced but never defined; defaulting to false gives a plain, single
// universal APK, which is what a normal Android Studio debug/run needs.
// Override on the command line with -PshouldSplit=true for release-style split builds.
def shouldSplit = project.hasProperty("shouldSplit") ? project.property("shouldSplit").toString().toBoolean() : false

// Whether this is the fdroid "website, fully de-googled" build. Defaults to false;
// pass -PwebsiteDegoogled=true to flip it on, matching the comment above.
def isWebsiteDegoogled = project.hasProperty("websiteDegoogled") ? project.property("websiteDegoogled").toString().toBoolean() : false

try {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} catch (Exception ex) {
    logger.info("missing keystore prop: $ex.message")
    keystoreProperties['keyAlias'] = ''
    keystoreProperties['keyPassword'] = ''
    keystoreProperties['storeFile'] = '/dev/null'
    keystoreProperties['storePassword'] = ''
}

// ref: developer.android.com/build/jdks#target-compat
java {
    toolchain {
    }
}

android {
    // NOTE: the block-style `compileSdk { version = release(37) {...} }` DSL only exists
    // starting with AGP 9.0's new interfaces. This project pins AGP 8.13.1 (see root
    // build.gradle), which only understands the plain property form below.
    compileSdk 37
    // https://developer.android.com/studio/build/configure-app-module
    namespace 'com.celzero.bravedns'

    defaultConfig {
        applicationId "com.celzero.bravedns"
        minSdkVersion(23)
        targetSdkVersion(37)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Defaults to false; the fdroid flavor overrides it via -PwebsiteDegoogled=true.
        buildConfigField "boolean", "IS_WEBSITE_DEGOOGLD_BUILD", "false"
    }

        // archive.is/wlwD8
            // https://stackoverflow.com/a/34640602

    // https://developer.android.com/studio/build/configure-apk-splits
    // alpha builds produce a single universal apk
    // release builds produce split apk and universal apk
    splits.abi {
        if (!shouldSplit) {
            println('universal apk only (splits disabled)')
            enable false
        } else {
            println('split apks and universal apk (splits enabled)')
            enable true
            reset()
            // comma-separated list of ABIs to generate apks for
            include "arm64-v8a"
            // generates a universal APK in addition to per-ABI apks
        }
    }
    // version codes for each ABI variant
    project.ext.versionCodes = [
            'armeabi-v7a': 2,
            'arm64-v8a'  : 3,
            'x86'        : 8,
            'x86_64'     : 9
    ]
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            if (abi != null) {
                // ABI-specific output: assign the correct per-ABI version code
                // eg for arm64-v8a: 3 * 10000000 + versionCode
                def v = 673
                output.versionCodeOverride = v
            } else {
                // universal APK: preserve existing production behaviour (arm64-v8a multiplier)
                // so installed universal APKs are not treated as a downgrade
                // when splits are disabled (e.g. alpha builds), firstAbi is null; fall back to
                // the arm64-v8a multiplier (3) so versionCode arithmetic still works
                def firstAbi = variant.outputs.first().getFilter(com.android.build.OutputFile.ABI)
                def multiplier = firstAbi != null ? project.ext.versionCodes.get(firstAbi) : project.ext.versionCodes.get('arm64-v8a')
                def v = 673
                output.versionCodeOverride = v
            }
        }
    }

    buildTypes {
        release {
            // modified as part of #352, now webview is removed from app, flipping back
            // the setting to true
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                // Use SYMBOL_TABLE to reduce native symbol file size.
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
        leakCanary {
            matchingFallbacks = ['debug']
            initWith buildTypes.debug
        }
        alpha {
            // archive.is/y8uCB
            applicationIdSuffix ".alpha"
            minifyEnabled true
            shrinkResources true
            resValue "string", "app_name", "DNS Control(α)"
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseDebug {
             // for testing release build with debug signing config
            initWith buildTypes.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                // Use SYMBOL_TABLE to reduce native symbol file size.
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }

    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += [
            '-Xwarning-level=SENSELESS_COMPARISON:disabled'
        ]
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            keepDebugSymbols += ['**/*.so']
        }
    }

    // required for google play developer api model classes
    packaging {
        resources.excludes += "META-INF/INDEX.LIST"
    }

    flavorDimensions = ["releaseChannel", "releaseType"]
    productFlavors {
        fdroid {
            dimension "releaseChannel"
            // true only when built with -PwebsiteDegoogled=true (our own keys).
            buildConfigField "boolean", "IS_WEBSITE_DEGOOGLD_BUILD", String.valueOf(isWebsiteDegoogled)
        }
        full {
            dimension "releaseType"
            // getPackageInfo().versionCode not returning the correct value (in prod builds) when
            // value is set in AndroidManifest.xml so setting it here
            // for build type alpha, versionCode is set in env overriding gradle.properties
            versionCode = getVersionCode()
            versionName = gitVersion
            // add base version code to the build config, so that if there is override of
            // version numbers by some builds (because of split apks)
            buildConfigField "int", "BASE_VERSION_CODE", String.valueOf(appVersionCode)
            vectorDrawables.useSupportLibrary = true
        }
    }
    lint {
        abortOnError true
    }
}

configurations {
    download {
        transitive false
    }
}

def firestackRepo = project.findProperty("firestackRepo") ?: "github"
def firestackCommit = project.findProperty("firestackCommit") ?: "main"

def firestackDependency = { ->
    switch (firestackRepo) {
        case "jitpack":
            return "com.github.celzero:firestack:$firestackCommit@aar"
        case "github":
            return "com.github.celzero:firestack:$firestackCommit@aar"
        case "ossrh":
            return "com.celzero:firestack:$firestackCommit@aar"
        default:
            throw new GradleException("Unknown firestackRepo: $firestackRepo")
    }
}

